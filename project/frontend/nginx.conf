# =============================================================================
# ProjectHub - Root Nginx Configuration & Reverse Proxy Gateway
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

# -----------------------------------------------------------------------------
# Events context: Connection handling configuration
# -----------------------------------------------------------------------------
events {
    worker_connections  1024;
}

# -----------------------------------------------------------------------------
# HTTP context: Core HTTP server configuration
# -----------------------------------------------------------------------------
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Connection mapping for WebSocket support (RFC 6455)
    # Converts HTTP Upgrade headers to appropriate connection directives
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # Root directory pointing to compiled static Vite assets
        root /usr/share/nginx/html;
        index index.html;

        # Enable Gzip compression to optimize payload delivery
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml
            application/xml+rss
            image/svg+xml;

        # Security headers protecting client communication
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ---------------------------------------------------------------------
        # REST API Reverse Proxy: Forwards /api/* requests to ASP.NET Core backend
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts for API communication
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ---------------------------------------------------------------------
        # SignalR Hub Reverse Proxy: Handles WebSockets & SSE for live Kanban & notifications
        # ---------------------------------------------------------------------
        location /kanbanHub {
            proxy_pass http://backend:8080/kanbanHub;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for persistent duplex WebSocket connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
        }

        # ---------------------------------------------------------------------
        # Swagger UI Reverse Proxy (Optional developer convenience)
        # ---------------------------------------------------------------------
        location /swagger/ {
            proxy_pass http://backend:8080/swagger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------
        # Cache Control: Long-term immutable caching for hashed production assets
        # ---------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ---------------------------------------------------------------------
        # Single Page Application (SPA) Fallback Routing
        # Any URI that does not map to a real static file is routed to index.html
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
