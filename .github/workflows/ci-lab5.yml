# Dedicated CI workflow for Laboratory 5 (Room Booking API)
name: Lab 5 CI - Room Booking API

on:
  push:
    branches:
      - main
      - lab5
  pull_request:

jobs:
  test:
    name: Test & Build Docker Image (Lab 5)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roombooking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: ./lab5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/roombooking_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./lab5/package-lock.json

      - name: Install dependencies cleanly
        run: npm ci

      - name: Run Unit and Integration tests
        run: npm test

      - name: Verify Docker image builds cleanly
        run: docker build .
